# Flathub manifest — OFFLINE build of the Slint app (crates/ workspace).
#
# DRAFT prepared 2026-07-02 for the QBZ v2.0 (Tauri -> Slint) release.
# Before the PR: run ~/Personal/qbz/scripts/update-flathub.sh v2.x.x to
# point tag/commit at the release and regenerate cargo-sources.json from
# crates/Cargo.lock. npm-sources.json is gone (no more node build), as is
# the libayatana-appindicator module chain (Slint tray = ksni, pure Rust).
#
# Keep in sync with the network twin: qbz repo packaging/flatpak/com.blitzfc.qbz.yml

app-id: com.blitzfc.qbz
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen (aws-lc-sys et al.) needs libclang.
  - org.freedesktop.Sdk.Extension.llvm20
command: qbz
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio

  # Direct sound-device access (/dev/snd) for bit-perfect / exclusive
  # ALSA output, matching native installs. Flatpak has no granular
  # --device=snd; /dev/snd is only exposed via --device=all (same as
  # Strawberry, mpv, and other bit-perfect audio apps). --device=all
  # includes --device=dri (GPU), so the separate dri entry is dropped.
  - --device=all

  # Native PipeWire access
  - --filesystem=xdg-run/pipewire-0:ro

  # User music library
  - --filesystem=xdg-music

  # Discord IPC sockets for opt-in Rich Presence (#336).
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

  # Tray icon (ksni StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher

  # System keyring (GNOME Keyring, KDE Wallet) — OAuth token storage.
  - --talk-name=org.freedesktop.secrets

modules:
  - name: qbz
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        CARGO_HOME: /run/build/qbz/cargo
        CARGO_NET_OFFLINE: 'true'
        # Memory tier for 16 GB builders: the qbz_ui rustc is the ~30 GB
        # peak; single job + high codegen-units + opt 2 is the measured
        # MIN-footprint combination. Symbols stripped by [profile.release].
        CARGO_INCREMENTAL: '0'
        CARGO_BUILD_JOBS: '1'
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
        CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
    build-commands:
      - install -Dm0644 cargo/config .cargo/config.toml
      - cargo --offline build --release --manifest-path crates/Cargo.toml -p qbz
      - install -Dm755 crates/target/release/qbz /app/bin/qbz
      - install -Dm644 packaging/flatpak/com.blitzfc.qbz.desktop /app/share/applications/com.blitzfc.qbz.desktop
      - install -Dm644 com.blitzfc.qbz.metainfo.xml /app/share/metainfo/com.blitzfc.qbz.metainfo.xml
      - install -Dm644 packaging/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.blitzfc.qbz.png
      - install -Dm644 packaging/icons/48x48.png /app/share/icons/hicolor/48x48/apps/com.blitzfc.qbz.png
      - install -Dm644 packaging/icons/64x64.png /app/share/icons/hicolor/64x64/apps/com.blitzfc.qbz.png
      - install -Dm644 packaging/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.blitzfc.qbz.png
      - install -Dm644 packaging/icons/256x256.png /app/share/icons/hicolor/256x256/apps/com.blitzfc.qbz.png
      - install -Dm644 packaging/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.blitzfc.qbz.png
    sources:
      - type: git
        url: https://github.com/vicrodh/qbz.git
        tag: v2.0.0
        commit: 2caede7dd145d2a900aab49c37e331f74dd74b19
        x-checker-data:
          type: git
          tag-pattern: '^v(\d+\.\d+\.\d+)$'
      - type: file
        path: cargo/config
        dest: cargo
        dest-filename: config
      - type: file
        path: com.blitzfc.qbz.metainfo.xml
      - cargo-sources.json
