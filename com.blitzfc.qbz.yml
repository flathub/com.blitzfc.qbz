# Flathub manifest — OFFLINE build of the Slint app (crates/ workspace).
#
# DRAFT prepared 2026-07-02 for the QBZ v2.0 (Tauri -> Slint) release.
# Before the PR: run ~/Personal/qbz/scripts/update-flathub.sh v2.x.x to
# point tag/commit at the release and regenerate cargo-sources.json from
# crates/Cargo.lock. npm-sources.json is gone (no more node build), as is
# the libayatana-appindicator module chain (Slint tray = ksni, pure Rust).
#
# Keep in sync with the network twin: qbz repo packaging/flatpak/com.blitzfc.qbz.yml

app-id: com.blitzfc.qbz
# freedesktop, not GNOME: a binary repack needs only the base platform
# (alsa/fontconfig/GL/dbus — the app is Slint/winit, no GTK), it is lighter
# for users, and the org.gnome.Platform//49 install was failing on the
# x86_64 builders anyway.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: qbz
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio

  # Direct sound-device access (/dev/snd) for bit-perfect / exclusive
  # ALSA output, matching native installs. Flatpak has no granular
  # --device=snd; /dev/snd is only exposed via --device=all (same as
  # Strawberry, mpv, and other bit-perfect audio apps). --device=all
  # includes --device=dri (GPU), so the separate dri entry is dropped.
  - --device=all

  # Native PipeWire access
  - --filesystem=xdg-run/pipewire-0:ro

  # User music library
  - --filesystem=xdg-music

  # Discord IPC sockets for opt-in Rich Presence (#336).
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

  # Tray icon (ksni StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  # OFFICIAL UPSTREAM BINARIES (same publisher as the GitHub releases): the
  # Slint UI compiles as one ~1.6M-line generated Rust module whose single
  # rustc invocation peaks past what the Flathub builders provide — the
  # 2.0.0 test builds were OOM-killed even at the minimum-memory settings
  # (jobs=1, cu256, opt<=2). Upstream builds the very same tarballs on
  # 16 GB CI runners with 18 GB of swap; repackaging them here (Firefox /
  # Bitwarden pattern) keeps both architectures on Flathub.
  - name: qbz
    buildsystem: simple
    build-commands:
      - install -Dm755 qbz-dist/qbz /app/bin/qbz
      - install -Dm644 com.blitzfc.qbz.desktop /app/share/applications/com.blitzfc.qbz.desktop
      - install -Dm644 com.blitzfc.qbz.metainfo.xml /app/share/metainfo/com.blitzfc.qbz.metainfo.xml
      - for size in 32 48 64 128 256; do install -Dm644 "qbz-dist/icons/hicolor/${size}x${size}/apps/qbz.png"
        "/app/share/icons/hicolor/${size}x${size}/apps/com.blitzfc.qbz.png"; done
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/vicrodh/qbz/releases/download/v2.0.1/qbz_2.0.1_amd64.tar.gz
        sha256: 4c2ead084ff24fd43f5a9d8de35ea5a546eb87fa30fb62a4ecfbc588e1911099
        dest: qbz-dist
        x-checker-data:
          type: json
          url: https://api.github.com/repos/vicrodh/qbz/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/vicrodh/qbz/releases/download/v" + $version + "/qbz_" + $version + "_amd64.tar.gz"'
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/vicrodh/qbz/releases/download/v2.0.1/qbz_2.0.1_aarch64.tar.gz
        sha256: 60dbd92265e7b073b92033b85770c355d9ae00f93eb2c79d47a5d90331faaf34
        dest: qbz-dist
        x-checker-data:
          type: json
          url: https://api.github.com/repos/vicrodh/qbz/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/vicrodh/qbz/releases/download/v" + $version + "/qbz_" + $version + "_aarch64.tar.gz"'
      - type: file
        path: com.blitzfc.qbz.desktop
      - type: file
        path: com.blitzfc.qbz.metainfo.xml
